.f{opacity:.88;animation:fall var(--d) linear var(--o) infinite}
.w{animation:gap calc(var(--d)*12) linear var(--o) infinite}
.m{opacity:0;animation:carry calc(var(--d)*12) ease-in-out var(--o) infinite}
.m.r,.m.rd{--a:14deg}.m.s{--a:9deg}.m.cf,.m.ct{--a:4deg}
